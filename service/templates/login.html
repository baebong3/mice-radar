{% extends "base.html" %}
{% block title %}로그인 · {{ service }}{% endblock %}
{% block body %}
<section class="narrow card">
  <h1>로그인 · 가입</h1>
  <p>이메일 주소를 넣으면 로그인 링크를 보내드립니다. 처음이면 자동으로 가입됩니다.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="email" name="email" value="{{ email or '' }}" placeholder="이메일 주소" autocomplete="email" required aria-label="이메일 주소">
    <button class="btn">로그인 링크 받기</button>
  </form>
</section>
{% endblock %}
