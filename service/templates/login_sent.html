{% extends "base.html" %}
{% block title %}메일 확인 · {{ service }}{% endblock %}
{% block body %}
<section class="narrow card">
  <h1>메일을 확인해 주십시오</h1>
  <p><b>{{ email }}</b> 주소로 로그인 링크를 보냈습니다. 링크는 20분 동안 한 번만 쓸 수 있습니다.</p>
  <p class="hint">메일이 안 보이면 스팸함을 확인하거나 잠시 뒤 다시 요청해 주십시오.</p>
  {% if dev_link %}<p class="dev">개발 모드: <a href="{{ dev_link }}">로그인 링크 바로 열기</a></p>{% endif %}
</section>
{% endblock %}
