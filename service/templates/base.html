<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ service }}{% endblock %}</title>
<meta name="description" content="주제를 등록하면 매일 뉴스를 모아 요약 리포트를 메일로 보내드립니다.">
<meta name="theme-color" content="#14324f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="28" height="28">{{ service }}</a>
  <nav>
    <a href="/plans">요금제</a>
    {% if user %}
    <a href="/app">내 주제</a>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">로그아웃</button></form>
    {% else %}
    <a class="btn small" href="/login">시작하기</a>
    {% endif %}
  </nav>
</header>
<main>
{% if message %}<p class="flash" role="status">{{ message }}</p>{% endif %}
{% block body %}{% endblock %}
</main>
<footer class="foot">뉴스 출처: Google 뉴스 검색 결과. 기사 저작권은 각 언론사에 있으며 제목과 링크만 제공합니다.</footer>
<script src="/static/app.js" defer></script>
</body>
</html>
